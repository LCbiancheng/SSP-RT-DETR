task: detection

num_classes: 6
remap_mscoco_category: False

train_dataloader: 
  type: DataLoader
  dataset: 
    type: NeuDetDetection
    img_folder: ./NEU-DET-split/train/images/
    ann_folder: ./NEU-DET-split/train/annotations/
    transforms:
      type: Compose
      ops:
        - type: RandomPhotometricDistort
        - type: RandomZoomOut
          fill: 0
        - type: RandomIoUCrop
          p: 0.8
        - type: SanitizeBoundingBox
          min_size: 1
        - type: RandomHorizontalFlip
          p: 0.5
        - type: Resize
          size: [640, 640]
        - type: ToImageTensor
        - type: ConvertDtype
          dtype: torch.float32
        - type: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - type: SanitizeBoundingBox
          min_size: 1
        - type: ConvertBox
          out_fmt: cxcywh
          normalize: True
  shuffle: True
  batch_size: 4      # RTX 3080 10GB: relatively safe
  num_workers: 4
  drop_last: True 


val_dataloader:
  type: DataLoader
  dataset: 
    type: NeuDetDetection
    img_folder: ./NEU-DET-split/val/images/
    ann_folder: ./NEU-DET-split/val/annotations/
    transforms:
      type: Compose
      ops:
        - type: Resize
          size: [640, 640]
        - type: ToImageTensor
        - type: ConvertDtype
          dtype: torch.float32
        - type: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - type: ConvertBox
          out_fmt: cxcywh
          normalize: True

  shuffle: False
  batch_size: 16
  num_workers: 4
  drop_last: False


# Test dataloader configuration
test_dataloader:
  type: DataLoader
  dataset: 
    type: NeuDetDetection
    img_folder: ./NEU-DET-split/test/images/
    ann_folder: ./NEU-DET-split/test/annotations/
    transforms:
      type: Compose
      ops:
        - type: Resize
          size: [640, 640]
        - type: ToImageTensor
        - type: ConvertDtype
          dtype: torch.float32
        - type: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - type: ConvertBox
          out_fmt: cxcywh
          normalize: True

  shuffle: False
  batch_size: 16
  num_workers: 4
  drop_last: False
