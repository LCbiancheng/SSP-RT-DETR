__include__: [
  './rtdetr_r50vd_6x_neudet.yml',
]

# E23: PG-O2M-Lite + S2 Cross-Attention Fusion
PResNet:
  return_idx:
  - 0
  - 1
  - 2
  - 3

BaselineHybridEncoder:
  use_s2_enhance: true
  use_s2_attn_gated: false
  use_s2_cross_attn: true
  s2_in_channels: 64

BaselineRTDETRTransformer:
  use_pg_o2m: true
  pg_o2m_num_groups: 3
  pg_o2m_mask_ratio: 0.3
  pg_o2m_noise_std: 0.03
  pg_o2m_detach_aux_query: true
  pg_o2m_center_jitter: 0.03
  pg_o2m_scale_jitter: 0.05

BaselineSetCriterion:
  use_pg_o2m: true
  pg_o2m_loss_weight: 0.2
  pg_o2m_lite_top_m: 2
  pg_o2m_lite_iou_thr: 0.15
  pg_o2m_lite_cls_only: false
  pg_o2m_lite_exclude_hungarian: true
  pg_o2m_lite_decay: true
  pg_o2m_lite_decay_start_ratio: 0.6
  pg_o2m_lite_decay_end_ratio: 0.9
