__include__: [
  './rtdetr_r50vd_6x_neudet.yml',
]

# Innovation point 1: Adaptive Mosaic single point
# Narrow multi_scale range to avoid excessive scale drift during 200→640 upsampling
BaselineRTDETR:
  multi_scale:
  - 512
  - 544
  - 576
  - 608
  - 640

train_dataloader:
  dataset:
    use_adaptive_mosaic: true
    adaptive_mosaic_prob: 0.5
    adaptive_mosaic_same_image_threshold: 2
    adaptive_mosaic_size: 640
    adaptive_mosaic_close_last_epochs: 10
