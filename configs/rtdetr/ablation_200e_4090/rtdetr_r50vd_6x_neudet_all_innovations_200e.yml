__include__: [
  '../other_experiments/rtdetr_r50vd_6x_neudet_all_innovations.yml',
]

output_dir: ./output/E123_All_Innovations_200e
result_csv_name: E123_All_Innovations_results.csv
epoches: 200

train_dataloader:
  batch_size: 16
  num_workers: 6

val_dataloader:
  batch_size: 16
  num_workers: 6

optimizer:
  type: AdamW
  params:
    - params: 'backbone'
      lr: 0.00001
    - params: '^(?=.*encoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.
    - params: '^(?=.*decoder(?=.*bias|.*norm.*weight)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [150, 180]
  gamma: 0.1
